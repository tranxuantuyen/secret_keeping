[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "secret-keeping"
version = "0.1.0"
description = "A modular framework for secret-knowledge elicitation experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "PyYAML>=6.0",
  "torch>=2.1",
  "transformers>=4.46",
  "peft>=0.13",
  "tqdm>=4.66",
  "tensorboard>=2.14",
]

[project.optional-dependencies]
jacobian = ["huggingface-hub>=0.25"]
sae = ["sae-lens>=5.0"]
dev = ["ruff>=0.7"]

[tool.setuptools.packages.find]
include = ["secret_keeping*"]

[tool.ruff]
line-length = 110

