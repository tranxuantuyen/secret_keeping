  SECRET_CLASSES: [female, male]

METHOD:
  NAME: assistant_prefill
  PREFILL_FILE: prompts/gender/assistant_prefill.txt

AUDITOR:
  NAME: direct

RNG_SEED: 1
OUTPUT_DIR: output
