EXPERIMENT:
  NAME: gender_linear_probe
  MODE: evaluate
  DESCRIPTION: Supply a compatible pre-fitted checkpoint before running

MODEL:
  NAME: gemma
  BASE_MODEL: google/gemma-2-9b-it
  ADAPTER: bcywinski/gemma-2-9b-it-user-female
  USE_ADAPTER: true
  DTYPE: bfloat16
  DEVICE_MAP: auto
  CACHE_DIR: ../secret_keeping_old/secret_keeping/cache/huggingface

DATA:
  NAME: gender
  PROMPT_FILE: prompts/gender/standard.txt
  SECRET: female
  SECRET_CLASSES: [female, male]

METHOD:
  NAME: linear_probe
  LAYER: 23
  POSITION: first_person_pronouns
  CHECKPOINT: artifacts/gender_linear_probe.pt
  MODEL_ID: google/gemma-2-9b-it
  ACTIVATION_DIM: 3584

AUDITOR:
  NAME: direct

RNG_SEED: 1
OUTPUT_DIR: output

