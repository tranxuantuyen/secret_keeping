EXPERIMENT:
  NAME: taboo_logit_lens_gold
  MODE: evaluate

MODEL:
  NAME: gemma
  BASE_MODEL: google/gemma-2-9b-it
  ADAPTER: bcywinski/gemma-2-9b-it-taboo-gold
  USE_ADAPTER: true
  DTYPE: bfloat16
  DEVICE_MAP: auto
  ATTN_IMPLEMENTATION: flash_attention_2
  CACHE_DIR: ../secret_keeping_old/secret_keeping/cache/huggingface

DATA:
  NAME: taboo
  PROMPT_FILE: prompts/taboo/standard.txt
  SECRET: gold
  SECRET_CLASSES: [gold, flag, moon]

INFERENCE:
  MAX_NEW_TOKENS: 200
  TEMPERATURE: 1.0
  NUM_SAMPLES: 10
  BATCH_SIZE: 10

METHOD:
  NAME: logit_lens
  LAYER: 32
  POSITION: control_tokens_average
  TOP_K: 200

AUDITOR:
  NAME: llm
  MODEL: google/gemma-3-4b-it
  PROMPT_TEMPLATE: prompts/taboo/auditor_tokens.txt
  TEMPERATURE: 0.0
  TOP_K_EVIDENCE: 200

RNG_SEED: 1
OUTPUT_DIR: output
